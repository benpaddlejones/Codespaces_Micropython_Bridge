<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RPi Pico Serial Terminal</title>
    <link rel="icon" type="image/png" href="icon.png" />
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="header">
      <div class="branding">
        <img
          src="icon.png"
          alt="Pi Pico to Codespaces Bridge icon"
          class="branding-icon"
        />
        <span>RPi Pico -<br />Codespaces<br />Bridge</span>
      </div>

      <div class="toolbar-group">
        <!-- Top Bar: Connection + Options + Server Status -->
        <div class="toolbar">
          <button id="connectBtn">Connect Pico</button>
          <button id="disconnectBtn" disabled>Disconnect</button>
          <div class="separator"></div>
          <select id="baudRate" aria-label="Baud rate">
            <option value="300">300</option>
            <option value="1200">1200</option>
            <option value="2400">2400</option>
            <option value="4800">4800</option>
            <option value="9600">9600</option>
            <option value="19200">19200</option>
            <option value="38400">38400</option>
            <option value="57600">57600</option>
            <option value="74880">74880</option>
            <option value="115200" selected>115200</option>
            <option value="230400">230400</option>
            <option value="250000">250000</option>
            <option value="500000">500000</option>
            <option value="921600">921600</option>
            <option value="1000000">1000000</option>
          </select>
          <span id="status" class="status-indicator">Disconnected</span>
          <div class="separator"></div>
          <label class="checkbox-label">
            <input type="checkbox" id="timestampCheck" /> Timestamp
          </label>
          <button id="clearBtn">Clear</button>
          <button id="downloadBtn">Download Log</button>
          <div class="spacer"></div>
          <div
            id="serverStatus"
            class="server-status"
            title="Server disconnected"
          >
            <span class="server-dot">●</span>
            <span class="server-label">Server</span>
            <button
              id="restartServerBtn"
              class="btn-restart-server"
              title="Restart Server"
              aria-label="Restart bridge server"
              style="display: none"
            >
              ↻
            </button>
          </div>
        </div>

        <!-- Tab Strip: paginate the workspace into REPL / Device / Plotter -->
        <div class="tab-strip" role="tablist" aria-label="Workspace view">
          <button
            id="tab-btn-repl"
            class="tab-btn"
            data-tab="repl"
            role="tab"
            aria-selected="true"
            aria-controls="tab-panel-repl"
            tabindex="0"
            type="button"
          >
            💻 REPL
          </button>
          <button
            id="tab-btn-files"
            class="tab-btn"
            data-tab="files"
            role="tab"
            aria-selected="false"
            aria-controls="tab-panel-files"
            tabindex="-1"
            type="button"
          >
            📟 Device
          </button>
          <button
            id="tab-btn-plotter"
            class="tab-btn"
            data-tab="plotter"
            role="tab"
            aria-selected="false"
            aria-controls="tab-panel-plotter"
            tabindex="-1"
            type="button"
          >
            📈 Plotter
          </button>
        </div>

        <!-- REPL tab toolbar -->
        <div class="toolbar tools-bar tab-toolbar" data-tab="repl">
          <!-- Files Group -->
          <div class="tool-group">
            <span class="group-label">Files</span>
            <div class="group-buttons">
              <button
                id="listFilesBtn"
                class="tool-btn"
                title="List files on Pico"
              >
                📁 List
              </button>
              <select
                id="filePicker"
                class="file-picker"
                aria-label="Workspace file to run or upload"
                title="Select a Python file to run or upload"
              >
                <option value="">Select file...</option>
              </select>
              <button
                id="refreshFilesBtn"
                class="tool-btn"
                title="Reload workspace files"
                aria-label="Reload workspace files"
              >
                ↻
              </button>
              <button
                id="runFileBtn"
                class="tool-btn btn-run"
                title="Run selected file on Pico"
              >
                ▶️ Run
              </button>
            </div>
          </div>

          <div class="tool-separator"></div>

          <!-- Control Group -->
          <div class="tool-group">
            <span class="group-label">Control</span>
            <div class="group-buttons">
              <button
                id="stopBtn"
                class="tool-btn btn-stop"
                title="Stop running code (Ctrl+C) - Interrupts and returns to REPL"
              >
                🛑 Stop
              </button>
              <button
                id="softResetBtn"
                class="tool-btn btn-soft"
                title="Soft reset (Ctrl+D) - Restart MicroPython, runs main.py"
              >
                🔄 Soft
              </button>
              <button
                id="hardResetBtn"
                class="tool-btn btn-hard"
                title="Hard reset (machine.reset()) - Full reboot, USB disconnects"
              >
                ⚡ Hard
              </button>
            </div>
          </div>

          <div class="tool-separator"></div>

          <!-- Device Info (visible on REPL so you always see what's connected) -->
          <div class="tool-group device-info-group">
            <span class="group-label">Device</span>
            <div
              id="deviceInfo"
              class="device-info"
              title="Connect to detect device"
            >
              <span class="device-name">Not detected</span>
            </div>
          </div>
        </div>

        <!-- Files tab toolbar -->
        <div class="toolbar tools-bar tab-toolbar" data-tab="files" hidden>
          <!-- Upload Group -->
          <div class="tool-group">
            <span class="group-label">Upload</span>
            <div class="group-buttons">
              <button
                id="uploadFileBtn"
                class="tool-btn"
                title="Upload selected file to Pico"
              >
                📄 File
              </button>
              <button
                id="uploadLibBtn"
                class="tool-btn"
                title="Upload /lib folder to Pico"
              >
                📚 Lib
              </button>
              <button
                id="uploadProjectBtn"
                class="tool-btn btn-upload-all"
                title="Upload entire project (lib + py_scripts + main.py)"
              >
                📦 All
              </button>
            </div>
          </div>

          <div class="tool-separator"></div>

          <!-- System Group -->
          <div class="tool-group">
            <span class="group-label">System</span>
            <div class="group-buttons">
              <button
                id="bootloaderBtn"
                class="tool-btn btn-boot"
                title="Enter bootloader (UF2) mode for firmware updates"
              >
                💾 Boot
              </button>
              <div class="btn-group firmware-split" data-bs-theme="dark">
                <button
                  id="firmwareBtn"
                  type="button"
                  class="tool-btn btn-firmware"
                  title="Download latest MicroPython firmware for detected board"
                >
                  ⬇️ Firmware
                </button>
                <button
                  id="firmwareDropdownBtn"
                  type="button"
                  class="tool-btn btn-firmware dropdown-toggle dropdown-toggle-split"
                  data-bs-toggle="dropdown"
                  data-bs-display="dynamic"
                  aria-expanded="false"
                  title="Pick a specific board"
                >
                  <span class="visually-hidden">Toggle firmware menu</span>
                </button>
                <ul
                  id="firmwareMenu"
                  class="dropdown-menu dropdown-menu-end firmware-menu"
                ></ul>
              </div>
              <button
                id="deleteAllBtn"
                class="tool-btn btn-danger"
                title="⚠️ Delete ALL files on Pico"
                aria-label="Wipe all files on Pico (destructive)"
              >
                🗑️ Wipe
              </button>
            </div>
          </div>

          <div class="tool-separator"></div>

          <!-- Help Group: device-specific references -->
          <div class="tool-group">
            <span class="group-label">Help</span>
            <div class="group-buttons">
              <a
                id="deviceDocsBtn"
                href="https://docs.micropython.org/en/latest/"
                target="_blank"
                rel="noopener noreferrer"
                class="tool-btn btn-docs"
                title="Open MicroPython Documentation"
              >
                📖 Docs
              </a>
              <button
                id="pinoutBtn"
                class="tool-btn btn-pinout"
                title="View Raspberry Pi Pico pinout diagram"
              >
                📌 Pinout
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Diff Modal (opened from Files tab Sync UI) -->
    <div
      id="syncDiffModal"
      class="sync-modal sync-diff-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="syncDiffTitle"
      style="display: none"
    >
      <div class="sync-modal-content sync-diff-content">
        <div class="sync-modal-header">
          <h2 id="syncDiffTitle">Diff</h2>
          <button
            id="syncDiffCloseBtn"
            class="pinout-close-btn"
            title="Close"
            aria-label="Close diff dialog"
          >
            ×
          </button>
        </div>
        <div class="sync-modal-body" id="syncDiffBody"></div>
      </div>
    </div>

    <!-- Pinout Modal -->
    <div
      id="pinoutModal"
      class="pinout-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="pinoutModalTitle"
      style="display: none"
    >
      <div class="pinout-modal-content">
        <div class="pinout-modal-header">
          <h2 id="pinoutModalTitle">Raspberry Pi Pico Pinout</h2>
          <button
            id="pinoutCloseBtn"
            class="pinout-close-btn"
            title="Close"
            aria-label="Close pinout dialog"
          >
            ×
          </button>
        </div>
        <div class="pinout-modal-body">
          <img
            src="pico-pinout.svg"
            alt="Raspberry Pi Pico Pinout Diagram"
            id="pinoutImage"
          />
        </div>
        <div class="pinout-modal-footer">
          <span class="pinout-tip">💡 Scroll to zoom, drag to pan</span>
          <button id="pinoutResetBtn" class="tool-btn">Reset View</button>
        </div>
      </div>
    </div>

    <div id="main-content">
      <!-- REPL tab body -->
      <div
        id="tab-panel-repl"
        class="tab-body"
        data-tab="repl"
        role="tabpanel"
        aria-labelledby="tab-btn-repl"
      >
        <div id="terminal-container"></div>
      </div>

      <!-- Files tab body: inline Workspace ↔ Pico sync UI -->
      <div
        id="tab-panel-files"
        class="tab-body"
        data-tab="files"
        role="tabpanel"
        aria-labelledby="tab-btn-files"
        hidden
      >
        <div class="files-panel">
          <div class="files-panel-header">
            <div>
              <h2>Workspace ↔ Pico</h2>
              <div id="syncProjectRoot" class="sync-project-root"></div>
            </div>
          </div>
          <div class="sync-toolbar">
            <button id="syncRefreshBtn" class="tool-btn btn-sync">
              🔄 Refresh
            </button>
            <button id="syncPullAllBtn" class="tool-btn">
              📥 Pull All Device Code
            </button>
            <button id="syncPushAllBtn" class="tool-btn btn-upload-all">
              📤 Push All Changes
            </button>
            <button
              id="syncMirrorBtn"
              class="tool-btn btn-danger"
              title="Make Pico exactly match workspace (deletes orphans)"
            >
              🪞 Mirror (push + delete orphans)
            </button>
            <div class="sync-summary" id="syncSummary"></div>
          </div>
          <div class="files-panel-body">
            <div class="sync-header-row">
              <span class="sync-status"></span>
              <span class="sync-path">File</span>
              <span class="sync-size">Size</span>
              <span class="sync-actions">Actions</span>
            </div>
            <div id="syncBody" class="sync-rows"></div>
          </div>
        </div>
      </div>

      <!-- Plotter tab body -->
      <div
        id="tab-panel-plotter"
        class="tab-body"
        data-tab="plotter"
        role="tabpanel"
        aria-labelledby="tab-btn-plotter"
        hidden
      >
        <div id="plotter-container">
          <div class="plotter-toolbar">
            <button id="plotterClearBtn" class="tool-btn">🗑️ Clear</button>
            <button id="plotterFreezeBtn" class="tool-btn">⏸️ Freeze</button>
            <button id="plotterDownloadBtn" class="tool-btn">
              📷 Save PNG
            </button>
            <button id="plotterFullscreenBtn" class="tool-btn">
              ⛶ Fullscreen
            </button>
            <div class="separator"></div>
            <label class="checkbox-label">
              <input type="checkbox" id="plotterAutoScaleCheck" checked /> Auto
              Scale
            </label>
            <span class="plotter-info">
              Format: <code>value</code> or <code>v1,v2,v3</code> or
              <code>label:value</code>
            </span>
            <div class="spacer"></div>
            <div id="plotterLegend" class="plotter-legend"></div>
          </div>
          <canvas id="plotterCanvas"></canvas>
        </div>
      </div>
    </div>

    <div class="input-bar" data-tab="repl">
      <input
        type="text"
        id="serialInput"
        placeholder="Type command..."
        aria-label="Serial command to send"
        disabled
      />
      <select id="lineEnding" aria-label="Line ending">
        <option value="none">No line ending</option>
        <option value="nl">Newline</option>
        <option value="cr">Carriage return</option>
        <option value="nlcr" selected>Both NL & CR</option>
      </select>
      <button id="sendBtn" disabled>Send</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <!-- Bootstrap JS Bundle -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
      crossorigin="anonymous"
    ></script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
